<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acces debloque</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #0b0c0e;
    color: #e8e8ea;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  main {
    text-align: center;
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #6f7075;
    display: inline-flex;
    align-items: center;
    gap: 9px;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
    animation: pulse 2.4s ease-out infinite;
  }
  .code {
    margin: 26px 0 22px;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: clamp(28px, 7vw, 46px);
    letter-spacing: 0.04em;
    color: #f4f4f5;
    cursor: pointer;
    user-select: all;
    transition: color 0.2s ease;
  }
  .code:hover { color: #34d399; }
  .hint {
    font-size: 14px;
    line-height: 1.5;
    color: #a1a1a6;
    max-width: 34ch;
    margin: 0 auto;
  }
  .hint b { color: #e8e8ea; font-weight: 600; }
  .sub {
    margin-top: 14px;
    font-size: 12px;
    color: #56575b;
    min-height: 1.1em;
    transition: color 0.2s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
    70%  { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }
</style>
</head>
<body>
  <main>
    <div class="label"><span class="dot"></span>Acces debloque</div>
    <!-- CODE A CHANGER ICI (garde-le identique dans les deux endroits : le texte affiche et data-code) -->
    <div class="code" id="code" data-code="CS29-R4PIDF1RE" role="button" tabindex="0" aria-label="Copier le code">CS29-R4PIDF1RE</div>
    <p class="hint">Ce n'est pas le flag. Renvoie ce code au bouton en <b>POST</b>, en le passant en <b>parametre</b>, pour obtenir le flag.</p>
    <p class="sub" id="sub">Clique le code pour le copier.</p>
  </main>

  <script>
    var el = document.getElementById("code");
    var sub = document.getElementById("sub");
    function copy() {
      var value = el.getAttribute("data-code");
      navigator.clipboard.writeText(value).then(function () {
        sub.textContent = "Code copie.";
        sub.style.color = "#34d399";
        setTimeout(function () {
          sub.textContent = "Clique le code pour le copier.";
          sub.style.color = "";
        }, 1600);
      });
    }
    el.addEventListener("click", copy);
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copy(); }
    });
  </script>
</body>
</html>
