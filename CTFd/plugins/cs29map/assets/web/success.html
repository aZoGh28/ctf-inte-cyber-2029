<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epreuve reussie</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    background: #0b0c0e;
    color: #e8e8ea;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 30rem;
    text-align: center;
    animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .check {
    width: 46px; height: 46px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid rgba(52, 211, 153, 0.35);
    color: #34d399;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .check svg { width: 22px; height: 22px; stroke-dasharray: 26; stroke-dashoffset: 26; animation: draw 0.5s 0.25s ease forwards; }
  .label {
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #6f7075;
  }
  .flag {
    margin: 18px 0 20px;
    padding: 16px 18px;
    border: 1px solid #23262b;
    border-radius: 14px;
    background: #101215;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: clamp(18px, 4.5vw, 26px);
    letter-spacing: 0.02em;
    color: #f4f4f5;
    cursor: pointer;
    user-select: all;
    word-break: break-all;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .flag:hover { border-color: rgba(52, 211, 153, 0.5); color: #34d399; }
  .hint {
    font-size: 14px;
    line-height: 1.55;
    color: #a1a1a6;
    max-width: 36ch;
    margin: 0 auto;
  }
  .hint b { color: #e8e8ea; font-weight: 600; }
  .sub {
    margin-top: 12px;
    font-size: 12px;
    color: #56575b;
    min-height: 1.1em;
    transition: color 0.2s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
  <main>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"></path>
      </svg>
    </div>
    <div class="label">Epreuve reussie</div>
    <div class="flag" id="flag" data-flag="{{ flag }}" role="button" tabindex="0" aria-label="Copier le flag">{{ flag }}</div>
    <p class="hint">Voici ton flag. Copie-le et <b>soumets-le sur la plateforme</b> pour valider l'epreuve.</p>
    <p class="sub" id="sub">Clique le flag pour le copier.</p>
  </main>

  <script>
    var el = document.getElementById("flag");
    var sub = document.getElementById("sub");
    function copy() {
      var value = el.getAttribute("data-flag");
      navigator.clipboard.writeText(value).then(function () {
        sub.textContent = "Flag copie.";
        sub.style.color = "#34d399";
        setTimeout(function () {
          sub.textContent = "Clique le flag pour le copier.";
          sub.style.color = "";
        }, 1600);
      });
    }
    el.addEventListener("click", copy);
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copy(); }
    });
  </script>
</body>
</html>
