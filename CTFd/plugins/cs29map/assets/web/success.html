<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epreuve reussie</title>
<style>
  body {
    min-height: 100dvh; margin: 0;
    display: grid; place-items: center;
    background: #0b0c0e; color: #e8e8ea;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 16px; color: #34d399; }
  .flag {
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace;
    font-size: clamp(18px, 5vw, 26px);
    padding: 14px 18px; border: 1px solid #23262b; border-radius: 12px;
    background: #101215; color: #f4f4f5; user-select: all; word-break: break-all;
  }
  p { margin: 16px 0 0; font-size: 14px; color: #a1a1a6; }
</style>
</head>
<body>
  <main>
    <h1>Epreuve reussie</h1>
    <div class="flag">{{ flag }}</div>
    <p>Copie ce flag et soumets-le sur la plateforme.</p>
  </main>
</body>
</html>
